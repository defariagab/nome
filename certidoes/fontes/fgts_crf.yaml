codigo: fgts_crf
nome: CRF/FGTS — Caixa Econômica Federal
url: https://consulta-crf.caixa.gov.br/consultacrf/pages/consultaEmpregador.jsf
resultado: pagina_pdf
verificado_em: 2026-08-28
# A consulta tem DUAS etapas, e parar na primeira era o erro anterior: a página
# de resultado só diz se a empresa está regular e oferece o link
# "Obtenha o Certificado de Regularidade do FGTS - CRF". O certificado mesmo
# está depois desse clique.
passos:
  - acao: abrir
    url: "{url}"
  - acao: selecionar
    seletor: "[id='mainForm:tipoEstabelecimento']"
    valor: "{fgts_tipo_inscricao}"   # 1 = CNPJ, 3 = CPF
  - acao: preencher
    seletor: "[id='mainForm:txtInscricao1']"
    valor: "{documento}"
  - acao: selecionar
    seletor: "[id='mainForm:uf']"
    valor: "{uf}"
  - acao: clicar
    seletor: "[id='mainForm:btnConsultar']"
  - acao: esperar
    ms: 2500
  # A situação do empregador aparece aqui. Se houver irregularidade, a Caixa não
  # oferece o certificado, e o passo seguinte falha dizendo isso.
  - acao: exigir_texto
    alternativas:
      - "REGULAR no FGTS"
      - "Obtenha o Certificado"
    mensagem: >-
      A Caixa não apresentou a situação de regularidade. Pode ser pendência de
      FGTS do empregador ou instabilidade do sistema — a tela que ela devolveu
      está em Detalhes, nesta solicitação.
  - acao: clicar
    seletor: "a:has-text('Certificado de Regularidade do FGTS')"
  - acao: esperar
    ms: 3000
  # Só o certificado de verdade traz validade e número; a página anterior não.
  - acao: exigir_texto
    alternativas:
      - "Validade:"
      - "Certificado Número"
    mensagem: >-
      Cheguei à consulta, mas o certificado em si não abriu. A tela que a Caixa
      devolveu está em Detalhes, nesta solicitação.
  # O certificado aberto ainda é a tela do sistema, com os botões "Visualizar" e
  # "Voltar". O documento que se apresenta a terceiros é o que vem depois do
  # "Visualizar" — é ele que vai para o arquivo.
  - acao: clicar
    seletor: "input[value='Visualizar'], a:has-text('Visualizar'), button:has-text('Visualizar')"
    seguir_janela: true
    opcional: true
  - acao: esperar
    ms: 2500
  - acao: exigir_texto
    alternativas:
      - "Validade:"
      - "Certificado Número"
      - "Número do CRF"
    mensagem: >-
      Abri o certificado, mas a versão para impressão não carregou. A tela da
      Caixa está em Detalhes, nesta solicitação.
  - acao: salvar_pagina_pdf
