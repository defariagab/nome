codigo: fgts_crf
nome: CRF/FGTS — Caixa Econômica Federal
url: https://consulta-crf.caixa.gov.br/consultacrf/pages/consultaEmpregador.jsf
resultado: pagina_pdf
verificado_em: 2026-08-27
passos:
  - acao: abrir
    url: "{url}"
  - acao: selecionar
    seletor: "[id='mainForm:tipoEstabelecimento']"
    valor: "{fgts_tipo_inscricao}"   # 1 = CNPJ, 3 = CPF
  - acao: preencher
    seletor: "[id='mainForm:txtInscricao1']"
    valor: "{documento}"
  - acao: selecionar
    seletor: "[id='mainForm:uf']"
    valor: "{uf}"
  - acao: clicar
    seletor: "[id='mainForm:btnConsultar']"
  - acao: esperar
    ms: 2500
  # "Regularidade" sozinha não serve: a página de erro da Caixa se chama
  # "Situação de Regularidade do Empregador" e diz justamente o contrário.
  # Exigimos o nome do documento emitido.
  - acao: exigir_texto
    alternativas:
      - "certificado de regularidade"
      - "CRF"
    mensagem: >-
      A Caixa não apresentou o certificado. Pode ser pendência de FGTS do
      empregador ou instabilidade do sistema — confira a tela do navegador.
  - acao: salvar_pagina_pdf
