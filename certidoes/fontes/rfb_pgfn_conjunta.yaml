codigo: rfb_pgfn_conjunta
nome: CND Federal — Receita Federal / PGFN
url: https://servicos.receitafederal.gov.br/servico/certidoes/#/home
resultado: anexo_manual
# O portal da Receita Federal recusa navegador automatizado. Em 27/08/2026 ele
# respondeu, com todas as letras: "o seu acesso foi bloqueado por possuir
# atributos que o caracteriza como um acesso automatizado".
#
# Esse bloqueio existe de propósito, e o sistema não tenta disfarçar-se para
# passar por ele. A saída é melhor para o usuário, aliás: o sistema abre o
# endereço no navegador que a pessoa já usa — onde a sessão gov.br dela
# normalmente já está ativa — e continua cuidando do arquivamento, do nome do
# arquivo, da leitura da validade e do controle de vencimento.
passos:
  - acao: abrir_no_navegador
    url: "{url}"
  - acao: acao_manual
    instrucao: >-
      Abri o portal da Receita Federal no seu navegador. Emita a CND Federal por
      lá (entrando com o gov.br, se ele pedir) e salve o PDF. Depois anexe o
      arquivo aqui: o sistema arquiva, lê a validade e passa a avisar do
      vencimento como nas demais certidões.
