codigo: jf_certidao_unificada
nome: Certidão Unificada da Justiça Federal — CJF
url: https://certidao-unificada.cjf.jus.br/#/solicitacao-certidao
resultado: anexo_manual
# Conferido no escritório em 28/08/2026: o formulário tem mais etapas do que a
# automação sabia fazer — tipo de certidão (cível ou criminal), seleção de
# órgãos, escolha entre CPF e CNPJ por botão de opção, o número, e o e-mail em
# dois campos. A tentativa anterior ficava parada na tela sem preencher nada,
# que é pior do que não tentar.
#
# Enquanto os campos não forem mapeados um a um, o caminho honesto é abrir no
# navegador do usuário — onde a emissão leva menos de um minuto — e arquivar o
# PDF anexado, com controle de validade igual ao das demais.
#
# Para completar a automação: Configurações › Mapear um site novo, com este
# endereço e uns 30 segundos de espera, tendo o formulário à vista. O relatório
# traz a etiqueta e o tipo de cada campo, que é o que falta.
passos:
  - acao: abrir_no_navegador
    url: "{url}"
  - acao: acao_manual
    instrucao: >-
      Abri a Certidão Unificada da Justiça Federal no seu navegador. Escolha o
      tipo (cível ou criminal), informe CPF ou CNPJ e o e-mail, e solicite. O
      documento sai na hora e também vai por e-mail. Depois anexe o PDF aqui —
      lembrando que esta certidão não cobre o TRF6.
