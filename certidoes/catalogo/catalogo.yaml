# Catálogo de certidões.
#
# `validade_dias` é apenas o padrão do órgão: quando o próprio documento
# informa a data de validade, o sistema usa a data do documento.
# `verificado_em` é a data em que os seletores da receita foram conferidos
# contra o site real — receitas sem essa data ainda não foram validadas.

- codigo: rfb_pgfn_conjunta
  nome: Certidão Negativa de Débitos Relativos a Créditos Tributários Federais e à Dívida Ativa da União
  sigla: CND Federal
  orgao: Receita Federal do Brasil / Procuradoria-Geral da Fazenda Nacional
  esfera: federal
  validade_dias: 180
  requer_gov_br: false
  captcha: hcaptcha
  modo: assistido
  receita: rfb_pgfn_conjunta
  url: https://servicos.receitafederal.gov.br/servico/certidoes/#/home
  observacoes: >-
    Emitida em conjunto por RFB e PGFN, para PF e PJ. O portal exige login gov.br,
    que o sistema guarda num perfil de navegador: entra uma vez e as emissões
    seguintes reaproveitam a sessão. O caminho do formulário, depois do login,
    ainda precisa ser mapeado (Configurações › Mapear um site novo).

- codigo: cndt
  nome: Certidão Negativa de Débitos Trabalhistas
  sigla: CNDT
  orgao: Tribunal Superior do Trabalho
  esfera: federal
  validade_dias: 180
  requer_gov_br: false
  captcha: imagem
  modo: assistido
  receita: cndt
  url: https://cndt-certidao.tst.jus.br/inicio.faces
  verificado_em: 2026-08-27
  observacoes: >-
    Captcha de imagem exibido na própria tela do sistema para o usuário responder.
    Validade de 180 dias (art. 642-A, § 2º, da CLT).

- codigo: fgts_crf
  nome: Certificado de Regularidade do FGTS
  sigla: CRF/FGTS
  orgao: Caixa Econômica Federal
  esfera: federal
  validade_dias: 30
  requer_gov_br: false
  captcha: nenhum
  modo: assistido
  receita: fgts_crf
  url: https://consulta-crf.caixa.gov.br/consultacrf/pages/consultaEmpregador.jsf
  verificado_em: 2026-08-27
  observacoes: >-
    Consulta por CNPJ ou CPF do empregador, com a UF do estabelecimento. Quando o empregador está irregular
    o sistema não emite o certificado e informa a pendência.

- codigo: jf_certidao_unificada
  nome: Certidão Unificada da Justiça Federal (cível, criminal e eleitoral)
  sigla: Certidão JF
  orgao: Conselho da Justiça Federal
  esfera: federal
  validade_dias: 30
  captcha: recaptcha
  modo: assistido
  receita: jf_certidao_unificada
  url: https://certidao-unificada.cjf.jus.br/#/solicitacao-certidao
  observacoes: >-
    Uma única certidão para as Regiões da Justiça Federal, EXCETO o TRF6, que
    permanece fora do sistema unificado por tempo indeterminado — para a 6ª
    Região, emita à parte no site do próprio tribunal. Campos conferidos em
    27/08/2026; o site usa reCAPTCHA, resolvido por você na janela.

- codigo: tj_distribuicao_civel
  nome: Certidão de Distribuição Cível da Justiça Estadual
  orgao: Tribunal de Justiça (por UF)
  esfera: estadual
  validade_dias: 30
  captcha: desconhecido
  modo: manual
  url: ""
  observacoes: >-
    Cada tribunal tem seu próprio sistema, endereço e captcha. Cadastre a URL
    do seu tribunal nas configurações do tipo.

- codigo: tj_falencia_concordata
  nome: Certidão Negativa de Falência, Recuperação Judicial e Extrajudicial
  orgao: Tribunal de Justiça (por UF)
  esfera: estadual
  aplica_pf: false
  validade_dias: 30
  captcha: desconhecido
  modo: manual
  url: ""
  observacoes: Exigida na habilitação jurídica da maioria das licitações.

- codigo: sefaz_estadual
  nome: Certidão Negativa de Débitos Estaduais
  orgao: Secretaria de Estado da Fazenda (por UF)
  esfera: estadual
  validade_dias: 60
  captcha: desconhecido
  modo: manual
  url: ""
  observacoes: Configure a URL e a receita conforme a UF do titular.

- codigo: municipal_tributos
  nome: Certidão Negativa de Tributos Municipais
  orgao: Prefeitura Municipal
  esfera: municipal
  validade_dias: 90
  captcha: desconhecido
  modo: manual
  url: ""
  observacoes: Configure por município; muitos exigem cadastro mobiliário (CCM/inscrição municipal).
