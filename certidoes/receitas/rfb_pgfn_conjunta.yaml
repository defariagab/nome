codigo: rfb_pgfn_conjunta
nome: CND Federal — Receita Federal / PGFN
url: https://servicos.receitafederal.gov.br/servico/certidoes/#/home
resultado: anexo_manual
ao_falhar: pedir_anexo
# O login gov.br fica guardado neste perfil: entra uma vez e as emissões
# seguintes reaproveitam a sessão.
perfil: govbr
# A conferência de 27/08/2026 mostrou que `#/home` é a página de entrada do
# portal: ela não tem campo de CPF/CNPJ — tem busca, banner de cookies, botão
# "Entrar com" (gov.br) e um hCaptcha. O caminho até o formulário da certidão
# está atrás do login e ainda não foi mapeado.
#
# Para completar esta receita: Configurações › Mapear um site novo, com este
# endereço e uma espera de 90 segundos; entre com o gov.br e navegue até a tela
# de emissão da certidão durante essa espera. A lista de campos que aparecer é
# o que falta para os passos abaixo do login.
passos:
  - acao: abrir
    url: "{url}"
  - acao: clicar
    seletor: 'button:has-text("Aceitar")'
    opcional: true
  - acao: login_gov_br
    instrucao: >-
      Entre com o gov.br na janela do navegador que foi aberta no portal da
      Receita. O login fica guardado: nas próximas emissões você não precisa
      repetir.
  - acao: acao_manual
    instrucao: >-
      Conclua a emissão da CND Federal no navegador e salve o PDF. Depois anexe
      o arquivo aqui para o sistema arquivar e controlar a validade.
